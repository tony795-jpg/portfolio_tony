<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Nguyen | Photographic Archive & Visual Studies</title>

    <meta name="description" content="Photography portfolio of Tony Nguyen. Portrait, events, automotive, still life and nature work. Based in Helsinki, available for commission.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tony Nguyen Archive">
    <meta property="og:title" content="Tony Nguyen | Photographic Archive & Visual Studies">
    <meta property="og:description" content="Photography portfolio of Tony Nguyen. Portrait, events, automotive, still life and nature work. Based in Helsinki, available for commission.">
    <meta property="og:url" content="https://tonynguyen795-portfolio.netlify.app/">
    <meta property="og:image" content="https://tony-hp-compaq-8200-elite-mt-pc.taild6c232.ts.net/photos/events-05-1600.jpg">
    <meta property="og:image:width" content="1600">
    <meta property="og:image:height" content="1067">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tony Nguyen | Photographic Archive & Visual Studies">
    <meta name="twitter:image" content="https://tony-hp-compaq-8200-elite-mt-pc.taild6c232.ts.net/photos/events-05-1600.jpg">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* paint-to-sample */
            --tiefschwarz: #070707;   /* Jet Black Metallic */
            --carraraweiss: #f5f5f5;  /* Carrara White */
            --achatgrau: #888888;     /* Agate Grey */
            --kreide: #d8d5cc;        /* Chalk */
            --karminrot: #a51422;     /* Carmine Red. Was Ferrari Rosso Corsa
                                         #d40000 (too bright). Change it HERE, once. */
        }

        body {
            background-color: var(--tiefschwarz);
            color: var(--carraraweiss);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .editorial-font { font-family: 'Cormorant Garamond', serif; }
        .display-font { font-family: 'Bricolage Grotesque', sans-serif; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--tiefschwarz); }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--karminrot); }

        /* Fine grain noise overlay */
        .noise {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.025; z-index: 9999; pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .grid-img-container { position: relative; overflow: hidden; background: #0d0d0d; }
        .grid-img { display: block; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(35%) contrast(1.05); }
        .grid-item:hover .grid-img { transform: scale(1.04); filter: grayscale(0%) contrast(1); }

        /* Scroll Reveal Framework */
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .lightbox-overlay { opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in-out; }
        .lightbox-overlay.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="relative min-h-screen selection:bg-red-950 selection:text-red-200">

    <div class="noise"></div>

    <div class="max-w-7xl mx-auto px-4 md:px-8 lg:px-16 2xl:px-6 py-12 md:py-24">

        <header class="mb-16 md:mb-24 flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-zinc-900 pb-8">
            <div>
                <div class="text-xs uppercase tracking-[0.4em] text-[color:var(--karminrot)] font-semibold mb-2">Visual Exhibition</div>
                <h1 class="display-font text-4xl md:text-6xl font-normal transition-all duration-300 hover:tracking-wide">
                    TONY NGUYEN <span class="editorial-font italic text-[#c5c2b9] hover:text-[color:var(--kreide)] transition-colors duration-300 font-normal">Archive</span>
                </h1>
                <p class="text-xs uppercase tracking-[0.25em] text-zinc-500 mt-3">Portrait · Events · Automotive · Still Life · Nature</p>
            </div>
            <div class="text-left md:text-right text-xs text-zinc-500 max-w-xs space-y-1">
                <div>Based in Helsinki, FI</div>
                <div>Portfolio Edition 1.0</div>
                <div>Available for Commission</div>
            </div>
        </header>

        <div class="flex flex-wrap gap-3 mb-12 text-xs uppercase tracking-[0.15em] border-b border-zinc-900 pb-6">
            <span class="text-zinc-500 mr-2 flex items-center">Filter Archive:</span>
            <button onclick="filterGallery('all', event)" class="filter-btn px-3 py-1 bg-zinc-900 border border-zinc-800 text-white transition duration-300">All Studies</button>
            <button onclick="filterGallery('portrait', event)" class="filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300">Portrait</button>
            <button onclick="filterGallery('events', event)" class="filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300">Events</button>
            <button onclick="filterGallery('still-life', event)" class="filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300">Still Life</button>
            <button onclick="filterGallery('nature', event)" class="filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300">Nature</button>
            <button onclick="filterGallery('automotive', event)" class="filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300">Automotive</button>
        </div>

        <!-- Masonry grid (CSS columns) rendered from the `photos` array in the script below -->
        <main id="archive-grid" class="columns-1 md:columns-2 lg:columns-3 gap-3"></main>

        <div id="lightbox" class="lightbox-overlay fixed inset-0 z-[10000] bg-[#060606f2] backdrop-blur-md flex items-center justify-center p-3">
            <div id="lightbox-counter" class="absolute top-4 left-5 text-[10px] 2xl:text-xs tracking-[0.2em] text-zinc-400 tabular-nums pointer-events-none"></div>
            <button onclick="closeLightbox()" class="absolute top-3 right-4 z-10 text-zinc-400 hover:text-[color:var(--karminrot)] text-[10px] 2xl:text-xs uppercase tracking-[0.2em] p-2 transition duration-300">
                <i class="fa-solid fa-xmark mr-1"></i> Close [ESC]
            </button>

            <button onclick="stepLightbox(-1)" aria-label="Previous photo" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 z-10 text-zinc-500 hover:text-[color:var(--karminrot)] text-xl p-3 transition duration-300">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button onclick="stepLightbox(1)" aria-label="Next photo" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 z-10 text-zinc-500 hover:text-[color:var(--karminrot)] text-xl p-3 transition duration-300">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <img id="lightbox-img" src="" alt="" class="max-h-[85vh] max-w-[85vw] object-contain border border-zinc-900 shadow-2xl">

            <h2 id="lightbox-title" class="hidden"></h2>
            <p id="lightbox-client" class="absolute bottom-4 left-5 text-[10px] 2xl:text-xs tracking-[0.2em] text-[color:var(--karminrot)] uppercase pointer-events-none"></p>
            <span id="lightbox-tag" class="absolute bottom-4 right-4 text-[10px] 2xl:text-xs tracking-[0.2em] border border-zinc-800 bg-zinc-950/70 px-2 py-0.5 text-zinc-400 uppercase pointer-events-none"></span>
        </div>

        <footer class="mt-24 pt-12 border-t border-zinc-900 text-xs text-zinc-600 tracking-wider flex flex-col md:flex-row justify-between gap-6">
            <div class="space-y-1">
                <p>© 2026 TONY NGUYEN.</p>
            </div>
            <div>
                CONTACT VIA
                <a href="mailto:duyng8@gmail.com" class="text-zinc-400 hover:text-[color:var(--karminrot)] underline decoration-dashed underline-offset-4 transition duration-300">DUYNG8@GMAIL.COM</a>
            </div>
        </footer>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxClient = document.getElementById('lightbox-client');
        const lightboxTag = document.getElementById('lightbox-tag');

        /* ============================================================
           ARCHIVE DATA — to add a photo, add ONE object to this list.
             id       : image id — becomes <id>-800.jpg / <id>-1600.jpg on the server
             category : portrait | events | automotive | still-life | nature
             title    : AUTO "<label> NN" series index; add title:'…' to pin a custom one
             client   : OPTIONAL — real commission credit; shows in lightbox only if present
             tag      : descriptive line shown in the lightbox
             label    : series name (Portrait/Events/…); drives the auto title
           ============================================================ */
        // ── IMAGE HOST ──────────────────────────────────────────────────
        // Photos are served from the home server (HP Compaq) over Tailscale Funnel.
        // Each photo needs TWO files on the server, named after its `id`:
        //     <id>-800.jpg    → grid thumbnail
        //     <id>-2560.jpg   → lightbox / full view (retina-crisp)
        // e.g. id 'portrait-01' → portrait-01-800.jpg + portrait-01-2560.jpg
        const BASE  = 'https://tony-hp-compaq-8200-elite-mt-pc.taild6c232.ts.net/photos';
        const thumb = (id) => `${BASE}/${id}-800.jpg`;    // lightweight grid preview
        const full  = (id) => `${BASE}/${id}-2560.jpg`;   // large, retina-crisp lightbox view

        // Launch set — 17 photos. Masonry grid crops nothing. Titles are AUTO-GENERATED as a
        // per-category series index ("Portrait 01", "Nature 02", …) by the numbering pass below.
        // To pin a custom title on a standout shot, add `title: '…'` to that entry (see 'Lily').
        // `client` is OPTIONAL: add it only for real commissions; it shows in the lightbox when present.
        const photos = [
            { id: 'events-05',    category: 'events',     tag: 'Live · 2023',                  label: 'Events'     },
            { id: 'portrait-01',  category: 'portrait',   tag: 'Áo Dài Portrait',              label: 'Portrait'   },
            { id: 'portrait-03',  category: 'portrait',   tag: 'Exterior Portrait', label: 'Portrait'   },
            { id: 'stilllife-01', category: 'still-life', tag: 'Product / Commercial',         label: 'Still Life' },
            { id: 'portrait-04',  category: 'portrait',   tag: 'Gothic Portrait',      label: 'Portrait'   },
            { id: 'events-01',    category: 'events',     tag: 'Keynote / Event',             label: 'Events',     client: 'DASH Sprint 2026' },
            { id: 'stilllife-02', category: 'still-life', tag: 'Still Life ',      label: 'Still Life' },
            { id: 'portrait-02',  category: 'portrait',   tag: 'Gothic Portrait',              label: 'Portrait'   },
            { id: 'portrait-07',  category: 'portrait',   tag: 'Áo Dài Portrait',           label: 'Portrait'   },
            { id: 'automotive-02', category: 'automotive', tag: 'Automotive',           label: 'Automotive', client: 'Veho Oy Ab · DASH Sprint 2026' },
            { id: 'nature-01',    category: 'nature',     tag: 'Vietnamese River',           label: 'Nature'     },
            { id: 'portrait-08',  category: 'portrait',   tag: 'Áo Dài Portrait',          label: 'Portrait'   },
            { id: 'portrait-09',  category: 'portrait',   tag: 'Áo Dài Portrait',           label: 'Portrait'   },
            { id: 'portrait-10',  category: 'portrait',   tag: 'Exterior Portrait',     label: 'Portrait'   },
            { id: 'automotive-01', category: 'automotive', tag: 'Automotive',           label: 'Automotive', client: 'Veho Oy Ab · DASH Sprint 2026' },
            { id: 'nature-02',    category: 'nature',     tag: 'Green Snake',        label: 'Nature'     },
            { id: 'events-02',    category: 'events',     tag: 'Crowd / Event',               label: 'Events',     client: 'DASH Sprint 2026' },
        ];

        // Auto-number photos within each category → "Portrait 01", "Nature 02", …
        // A custom `title` on an entry (e.g. 'Lily') is kept and doesn't consume a number.
        const _seriesCount = {};
        photos.forEach(p => {
            if (p.title) return;
            _seriesCount[p.label] = (_seriesCount[p.label] || 0) + 1;
            p.title = `${p.label} ${String(_seriesCount[p.label]).padStart(2, '0')}`;
        });

        // The card template — written ONCE. Every photo is rendered through this.
        function cardHTML(p, i) {
            return `
            <div class="grid-item group cursor-pointer break-inside-avoid mb-3" data-category="${p.category}" onclick="openLightbox(${i})">
                <div class="grid-img-container">
                    <img src="${thumb(p.id)}"
                         srcset="${thumb(p.id)} 800w, ${BASE}/${p.id}-1600.jpg 1600w, ${full(p.id)} 2560w"
                         sizes="(min-width:1024px) 33vw, (min-width:768px) 50vw, 100vw"
                         alt="${p.title}" class="grid-img w-full h-auto" loading="lazy">
                </div>
            </div>`;
        }

        // Render the whole grid from the data above.
        document.getElementById('archive-grid').innerHTML = photos.map(cardHTML).join('');

        // Lightbox navigation state: which photo is open, and which filter is active
        // (prev/next steps only through the photos visible under the current filter).
        let currentIndex = -1;
        let activeCategory = 'all';

        function visibleIndices() {
            return photos
                .map((p, i) => (activeCategory === 'all' || p.category === activeCategory) ? i : -1)
                .filter(i => i !== -1);
        }

        function openLightbox(i) {
            const p = photos[i];
            currentIndex = i;
            lightboxImg.src = full(p.id);
            lightboxImg.alt = p.title;
            lightboxTitle.innerText = '';
            lightboxTitle.style.display = 'none';
            lightboxClient.innerText = p.client || '';
            lightboxClient.style.display = p.client ? '' : 'none';
            lightboxTag.innerText = p.tag;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';

            // Position counter + preload neighbours so stepping feels instant
            const vis = visibleIndices();
            const pos = vis.indexOf(i);
            document.getElementById('lightbox-counter').innerText =
                pos === -1 ? '' : `${pos + 1} / ${vis.length}`;
            if (pos !== -1 && vis.length > 1) {
                new Image().src = full(photos[vis[(pos + 1) % vis.length]].id);
                new Image().src = full(photos[vis[(pos - 1 + vis.length) % vis.length]].id);
            }
        }

        function stepLightbox(dir) {
            const vis = visibleIndices();
            if (!vis.length) return;
            const pos = vis.indexOf(currentIndex);
            const next = pos === -1 ? vis[0] : vis[(pos + dir + vis.length) % vis.length];
            openLightbox(next);
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeLightbox(); return; }
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'ArrowRight') stepLightbox(1);
            if (e.key === 'ArrowLeft') stepLightbox(-1);
        });

        // Swipe left/right inside the lightbox (touch devices)
        let touchStartX = null;
        lightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
        lightbox.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            touchStartX = null;
            if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
        }, { passive: true });

        // Fixed Category Filter Engine
        function filterGallery(category, clickEvent) {
            activeCategory = category;
            const items = document.querySelectorAll('.grid-item');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => {
                btn.className = "filter-btn px-3 py-1 border border-zinc-900 text-zinc-500 hover:text-white hover:border-zinc-800 transition duration-300";
            });

            // Target the accurate trigger element safely
            const activeBtn = clickEvent.currentTarget || clickEvent.target;
            activeBtn.className = "filter-btn px-3 py-1 bg-zinc-900 border border-zinc-800 text-white transition duration-300";

            items.forEach(item => {
                const itemCat = item.getAttribute('data-category');
                if (category === 'all' || itemCat === category) {
                    item.style.display = 'block';
                    setTimeout(() => { item.style.opacity = '1'; item.style.transform = 'scale(1)'; }, 10);
                } else {
                    item.style.opacity = '0';
                    item.style.transform = 'scale(0.97)';
                    setTimeout(() => { item.style.display = 'none'; }, 300);
                }
            });
        }

        // Reveal Observer Engine
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) { entry.target.classList.add('active'); }
            });
        }, { rootMargin: '0px 0px -40px 0px', threshold: 0.05 });

        document.querySelectorAll('.grid-item, header').forEach((el) => {
            el.classList.add('reveal');
            observer.observe(el);
        });
    </script>
</body>
</html>
